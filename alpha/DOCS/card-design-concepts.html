<header><small>TEAM L2 / CARD STUDIES 12—15</small><h1>내 일상을 담는,<br>다음 네 장.</h1><p>기존 11종에 더할 디자인 제안. 가상 예시로 만든 시안이며 앱에 적용된 카드 양식은 아닙니다.</p><div class="toolbar"><button onclick="document.body.classList.toggle('compact')">크게 비교하기</button><button onclick="window.print()">인쇄 · PDF</button></div></header>

<figure><figcaption><strong>12. DOODLE NOTE</strong><span>글 / 사진 선택</span></figcaption><article class="card doodle"><span class="stamp">SMALL GOOD THINGS</span><svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M41 17c-17-15-36 5-23 23l23 25 23-26C77 20 54 3 41 17z"/><path d="m6 15 7 4M68 8l-3 8M69 60l7 4"/></svg><h2>별일 없이<br>좋았던 하루</h2><p class="copy">한 정거장 먼저 내려 걸었다.<br>집 앞 빵집에서 마지막 소금빵을 샀다.<br>이런 날도 남겨두고 싶다.</p><div class="underline"></div><p class="note">내일도 조금 천천히!</p><footer class="imprint">26.10.18　— 나　 DOODLE · 3:4　THEME: OAT</footer></article><p class="description">고른 글자와 비뚤어진 선의 균형. 낙서는 모서리에만 두고 읽는 흐름은 유지합니다.</p></figure>
<figure><figcaption><strong>13. MINI FEED</strong><span>사진 전용</span></figcaption><article class="card feed"><div class="feed-head"><span><i class="avatar">L2</i> MY LITTLE LOG</span><span>01 / 4.5</span></div><img src="../public/images/studio-cafe.png" alt="라테와 디저트가 놓인 창가 테이블"><div class="body"><h2>오후의 한 잔</h2><p class="copy">따뜻한 라테와 피낭시에.<br>잠깐 쉬어 가기 좋은 오후였다.</p><footer class="imprint">26.10.18 — 나　 FEED · 3:4　THEME: OAT</footer></div></article><p class="description">익숙한 피드 문법에서 좋아요·댓글·숫자 경쟁은 덜어냅니다. 기본 사진 카드 1순위 후보.</p></figure>
<figure><figcaption><strong>14. POCKET PHOTO</strong><span>사진 전용</span></figcaption><article class="card photocard"><div class="photo-frame"><img src="../public/images/studio-cafe.png" alt="나만의 포토카드로 남긴 카페의 오후"><span class="tag">MY FAVORITE ★</span><h2>사소한<br>좋아함</h2></div><div class="edition"><strong>AFTERNOON COLLECTION</strong><small>NO. 018</small></div><footer class="imprint">26.10.18 — 나　 POCKET · 3:4　THEME: LILAC</footer></article><p class="description">사진에 시선을 모으는 수집용 프레임. 작은 서명과 부드러운 라일락 테두리로 개인적인 소장감.</p></figure>
<figure><figcaption><strong>15. DAY PAGE</strong><span>텍스트 전용</span></figcaption><article class="card day"><div class="date-head"><span>OCTOBER 2026</span><span>SUNDAY</span></div><div class="calendar"><strong>18</strong><span>ONE DAY, ONE LOG.</span></div><h2>천천히 걸은 저녁</h2><p class="copy">이어폰을 빼니 바람 소리가 들렸다.<br>평범해서 오래 기억하고 싶은 하루.<br><br>다음에도 가끔은<br>한 정거장 먼저 내려야지.</p><footer class="imprint">26.10.18 — 나　 DAY · 3:4　THEME: SAGE</footer></article><p class="description">큰 날짜와 작은 일기를 묶는 달력형 기록. 사진 없이도 빈약해 보이지 않는 기본 글 카드 후보.</p></figure>
