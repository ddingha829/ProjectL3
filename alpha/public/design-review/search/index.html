<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="robots" content="noindex,nofollow">
 <title>L2 · 검색 영역 디자인 비교</title>
 <style>
  @font-face{font-family:Sebang;src:url('/fonts/sebang-gothic-regular.woff2') format('woff2');font-display:swap}
  @font-face{font-family:Sebang;src:url('/fonts/sebang-gothic-bold.woff2') format('woff2');font-weight:700;font-display:swap}
  *{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171719;font:14px/1.6 Sebang,sans-serif}main{max-width:920px;margin:auto;padding:24px 16px 40px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}header a{font-weight:700;font-size:26px;letter-spacing:-.1em;text-decoration:none;color:#141414}header a span{color:#ff3b1d}h1{font-size:18px;margin:0;letter-spacing:-.04em}.tabs{display:flex;gap:6px;padding:5px;background:#e9e9e4;border-radius:15px;margin-bottom:16px}.tabs button{flex:1;min-width:0;min-height:48px;padding:8px 6px;border:0;border-radius:11px;color:#62625b;background:none;font:700 13px/1.5 Sebang,sans-serif;cursor:pointer}.tabs button[aria-pressed=true]{background:white;color:#171719;box-shadow:0 2px 6px #0000000c}button:focus-visible,a:focus-visible{outline:2px solid #ff3b1d;outline-offset:3px}figure{margin:0;text-align:center}figure img{display:block;width:100%;max-width:390px;height:auto;margin:0 auto;border-radius:24px;box-shadow:0 8px 30px #1717190b;background:#fff}.detail{max-width:560px;margin:18px auto 0;text-align:center;min-height:72px}.detail strong{display:block;font-size:16px}.detail p{margin:5px 0 0;color:#6e6e67;font-size:13px}footer{text-align:center;padding-top:20px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center}footer a{font-size:13px;color:#65655e;text-underline-offset:4px}@media(min-width:760px){main{padding-top:32px}.tabs{max-width:560px;margin:0 auto 20px}figure img{max-width:390px}}
 </style>
</head>
<body>
 <main>
  <header><a href="/" aria-label="L2 미리보기로">L2<span>.</span></a><h1>검색 영역 디자인 비교</h1></header>
  <nav class="tabs" aria-label="디자인 시안 선택">
   <button type="button" data-design="a" aria-pressed="true">A · 분리형</button>
   <button type="button" data-design="b" aria-pressed="false">B · 한 줄</button>
   <button type="button" data-design="c" aria-pressed="false">C · 확장형</button>
  </nav>
  <figure><a id="original" href="search-a.png" target="_blank" rel="noopener"><img id="preview" src="search-a.png" width="780" height="1220" alt="A안: 검색과 분류를 위에, 보기 방식과 보관함을 아래에 분리한 화면"></a></figure>
  <div class="detail" aria-live="polite"><strong id="name">A · 검색과 도구 분리 — 추천</strong><p id="description">검색·분류와 보기·보관 도구의 위계를 나누고, 큰 외곽 박스를 걷어낸 구성입니다.</p></div>
  <footer><a href="/design-review/search-v2/">새 MCP 시안 보기</a><a href="comparison.png" target="_blank" rel="noopener">세 가지 나란히 보기</a><a href="/">앱 미리보기로</a></footer>
 </main>
 <script>
  const designs={a:{name:'A · 검색과 도구 분리 — 추천',description:'검색·분류와 보기·보관 도구의 위계를 나누고, 큰 외곽 박스를 걷어낸 구성입니다.',alt:'A안: 검색과 분류를 위에, 보기 방식과 보관함을 아래에 분리한 화면'},b:{name:'B · 한 줄 통합',description:'검색·분류·보기 전환을 한 줄에 모아 공간을 절약합니다. 아이콘 기능의 발견성은 조금 줄어듭니다.',alt:'B안: 검색창 오른쪽에 분류와 보기 방식 아이콘을 통합한 화면'},c:{name:'C · 검색할 때 확장',description:'평소에는 카드에 집중하고 검색 아이콘을 눌렀을 때 입력창을 여는 방향입니다.',alt:'C안: 로그 제목 옆에 검색 아이콘을 배치하고 기본 검색창을 접은 화면'}};
  document.querySelectorAll('[data-design]').forEach(button=>button.addEventListener('click',()=>{const id=button.dataset.design,design=designs[id];document.getElementById('preview').src=`search-${id}.png`;document.getElementById('preview').alt=design.alt;document.getElementById('original').href=`search-${id}.png`;document.getElementById('name').textContent=design.name;document.getElementById('description').textContent=design.description;document.querySelectorAll('[data-design]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
 </script>
</body>
</html>
